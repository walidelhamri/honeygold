<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — HoneyGold</title>
  <link rel="stylesheet" href="/admin/assets/css/admin.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo-mark">🍯</div>
      <h2>HoneyGold Admin</h2>
      <p>Sign in to manage your store</p>
    </div>

    <div class="login-error" id="login-error"></div>

    <div class="form-group">
      <label>Username</label>
      <input type="text" class="form-control" id="username" placeholder="admin" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" class="form-control" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn btn-primary" onclick="doLogin()" style="width:100%;justify-content:center;margin-top:0.5rem;" id="login-btn">
      Sign In
    </button>

    <p style="text-align:center;margin-top:1.5rem;font-size:0.78rem;color:var(--text-light);">
      Default credentials: <strong>admin</strong> / <strong>password</strong>
    </p>
  </div>
</div>

<script>
  // Check if already logged in
  if (localStorage.getItem('hg_token')) {
    window.location.href = '/admin/dashboard';
  }

  // Enter key
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doLogin();
  });

  async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('login-btn');
    const err = document.getElementById('login-error');

    if (!username || !password) {
      showError('Please enter username and password.');
      return;
    }

    btn.textContent = 'Signing in…';
    btn.disabled = true;
    err.style.display = 'none';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (data.success) {
        localStorage.setItem('hg_token', data.token);
        localStorage.setItem('hg_user', data.username);
        window.location.href = '/admin/dashboard';
      } else {
        showError(data.message || 'Invalid credentials.');
      }
    } catch {
      showError('Server error. Is the backend running?');
    } finally {
      btn.textContent = 'Sign In';
      btn.disabled = false;
    }
  }

  function showError(msg) {
    const err = document.getElementById('login-error');
    err.textContent = msg;
    err.style.display = 'block';
  }
</script>
</body>
</html>
